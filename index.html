<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>デイリー語彙力 単語帳（全298本）</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--tx:#1a1a1a;--sub:#666;--bd:#ddd;--ac:#2563eb;--ok:#16a34a;--okbg:#dcfce7;--ng:#dc6803;--ngbg:#ffedd5;--neu:#f1f1f3}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--tx:#eee;--sub:#aaa;--bd:#333;--ac:#60a5fa;--ok:#4ade80;--okbg:#14532d;--ng:#fb923c;--ngbg:#7c2d12;--neu:#2a2a2d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior-y:none}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:18px;margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--sub)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.tabs button{padding:9px 2px;font-size:13px}
button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;touch-action:manipulation}
button:focus{outline:none}button:focus-visible{outline:2px solid var(--ac)}
button:disabled{opacity:.35}
button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
select,input[type=search]{font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
.sub{color:var(--sub);font-size:13px}
/* sort card */
.stage{position:relative;margin-top:10px;user-select:none;-webkit-user-select:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 16px;text-align:center;position:relative;touch-action:pan-y;will-change:transform}
.card.anim{transition:transform .18s ease-out,opacity .18s}
.word{font-size:38px;font-weight:700;margin:12px 0;word-break:break-all}
.det{text-align:left;margin-top:12px;line-height:1.7}
.badge{position:absolute;top:14px;padding:4px 10px;border-radius:8px;font-weight:800;font-size:18px;border:3px solid;opacity:0;pointer-events:none}
.badge.k{left:14px;color:var(--ok);border-color:var(--ok);transform:rotate(-12deg)}
.badge.u{right:14px;color:var(--ng);border-color:var(--ng);transform:rotate(12deg)}
.cur{display:inline-block;margin-top:4px;font-size:12px;padding:2px 8px;border-radius:6px}
.cur.k{background:var(--okbg);color:var(--ok)}.cur.u{background:var(--ngbg);color:var(--ng)}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ans button{padding:16px 6px;font-size:17px;font-weight:700;background:var(--neu);transition:background .12s,color .12s}
.ans button.selk{background:var(--ok);border-color:var(--ok);color:#fff}
.ans button.selu{background:var(--ng);border-color:var(--ng);color:#fff}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.hint{text-align:center;margin-top:8px;font-size:12px;color:var(--sub)}
a{color:var(--ac)}
/* list */
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ctl .full{grid-column:1/-1}
.sbtn{padding:7px 8px;font-size:13px}
.items{margin-top:8px}
.it{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:6px}
.it input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--ac)}
.it .tx{flex:1;min-width:0}
.it .w{font-weight:700;font-size:16px}.it .r{color:var(--sub);font-size:12px;margin-left:6px}
.it .m{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{display:flex;flex:none;gap:4px}
.tg button{padding:8px 9px;font-size:13px;background:var(--neu)}
.tg button.k.act{background:var(--ok);color:#fff;border-color:var(--ok)}
.tg button.u.act{background:var(--ng);color:#fff;border-color:var(--ng)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0}
.pager span{font-size:13px;color:var(--sub)}
.bulk{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.bulk .in{max-width:640px;margin:0 auto}
.bulk .bt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.bulk .bt button{padding:9px 4px;font-size:13px;font-weight:700}
.bulk .bt .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.bulk .bt .u{background:var(--ng);color:#fff;border-color:var(--ng)}
.bulk button:disabled{opacity:.4}
details.uk{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}
details.uk summary{padding:10px;list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px}
details.uk summary::-webkit-details-marker{display:none}
details.uk summary .m{font-size:12px;color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.uk .body{padding:0 12px 12px;line-height:1.7;font-size:14px}
details.uk[open] summary .m{white-space:normal}
.empty{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:28px 16px;text-align:center;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:.92}
</style></head><body><div class="wrap">
<h1>デイリー語彙力 単語帳</h1>
<div class="stats"><div class="stat"><b id="sAll"></b><span>対象</span></div><div class="stat"><b id="sK"></b><span>知ってる</span></div><div class="stat"><b id="sU"></b><span>知らない</span></div><div class="stat"><b id="sN"></b><span>未仕分け</span></div></div>
<select id="vol" aria-label="動画で絞り込み"></select>
<div class="tabs"><button data-m="sort">仕分け</button><button data-m="focus">集中学習</button><button data-m="list">一覧</button><button data-m="unk">知らない一覧</button></div>
<div id="main"></div>
<div class="row"><button id="reset" class="sbtn">この範囲の仕分けをリセット</button></div>
<p class="sub">再生リスト「デイリー語彙力：デイリー20」全298本。語彙は各動画の概要欄【今日の語彙】から抽出。読み方・意味・用例はすべて字幕を使わず新たに書き下ろしたものです（全5,960語・用例各2文）。進捗はこの端末のブラウザに保存されます。</p>
</div>
<div id="bulk" class="bulk" style="display:none"></div>
<div id="toast" class="toast"></div>
<script>

 M.innerHTML='<div class="ctl"><select id="lf"><option value="all">すべての状態</option><option value="n">未仕分け</option><option value="k">知ってる</option><option value="u">知らない</option></select>'+
 '<input type="search" id="lq" placeholder="語・読み・意味で検索" value="'+esc(lq)+'">'+
 '<button class="sbtn" id="sv">表示中を選択</button><button class="sbtn" id="sa">該当すべて選択</button><button class="sbtn full" id="sc">選択解除</button></div><div id="lres"></div>';
 $('lf').value=lf;
 $('lf').onchange=e=>{lf=e.target.value;lp=0;selSet.clear();listBody()};
 $('lq').oninput=e=>{lq=e.target.value;lp=0;listBody()};
 $('sv').onclick=()=>{pageItems().forEach(x=>selSet.add(x.w));listBody()};
 $('sa').onclick=()=>{listFiltered(pool()).forEach(x=>selSet.add(x.w));listBody()};
 $('sc').onclick=()=>{selSet.clear();listBody()};
 listBody();
}
let _lfCache=[];
function pageItems(){return _lfCache.slice(lp*PER,lp*PER+PER)}
function pager(n,p,id){const pages=Math.max(1,Math.ceil(n/PER));return '<div class="pager"><button class="sbtn" data-pg="'+id+'" data-d="-1" '+(p<=0?'disabled':'')+'>‹ 前</button><span>'+n+'件・'+(p+1)+'/'+pages+'ページ</span><button class="sbtn" data-pg="'+id+'" data-d="1" '+(p>=pages-1?'disabled':'')+'>次 ›</button></div>'}
function listBody(){
 const P=pool();_lfCache=listFiltered(P);const n=_lfCache.length;const pages=Math.max(1,Math.ceil(n/PER));if(lp>=pages)lp=pages-1;
 const I=pageItems();
 let h=pager(n,lp,'l')+'<div class="items">'+I.map(x=>{const s=st[x.w]||'';return '<label class="it" data-w="'+esc(x.w)+'"><input type="checkbox" '+(selSet.has(x.w)?'checked':'')+'><div class="tx"><div><span class="w">'+esc(x.w)+'</span><span class="r">'+esc(x.r)+'</span></div><div class="m">'+pad(x.vol)+'・'+esc(x.m)+'</div></div><div class="tg"><button type="button" class="k'+(s==='k'?' act':'')+'" data-t="k">知ってる</button><button type="button" class="u'+(s==='u'?' act':'')+'" data-t="u">知らない</button></div></label>'}).join('')+'</div>'+(n>PER?pager(n,lp,'l'):'');
 if(!n)h='<div class="empty">該当する語はありません。</div>';
 const R=$('lres');R.innerHTML=h;
 R.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{lp+=+b.dataset.d;listBody();window.scrollTo(0,$('lres').offsetTop-60)});
 R.querySelectorAll('.it').forEach(el=>{const w=el.dataset.w;
  el.querySelector('input').onchange=e=>{if(e.target.checked)selSet.add(w);else selSet.delete(w);bulkBar()};
  el.querySelectorAll('.tg button').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const t=b.dataset.t;setSt(w,st[w]===t?'':t);save();stats(pool());
   const s=st[w]||'';el.querySelector('.k').classList.toggle('act',s==='k');el.querySelector('.u').classList.toggle('act',s==='u')})});
 bulkBar();
}
function bulkBar(){
 const B=$('bulk');if(mode!=='list'){B.style.display='none';return}
 const n=selSet.size;B.style.display='block';
 B.innerHTML='<div class="in"><div class="sub">'+n+' 件選択中'+(n?'':'（チェックボックスで選択）')+'</div><div class="bt"><button class="k" id="bk2" '+(n?'':'disabled')+'>まとめて知ってる</button><button class="u" id="bu2" '+(n?'':'disabled')+'>まとめて知らない</button><button id="bn2" '+(n?'':'disabled')+'>未仕分けに戻す</button></div></div>';
 const ap=v=>{const c=selSet.size;selSet.forEach(w=>setSt(w,v));save();selSet.clear();stats(pool());listBody();toast(c+'件を'+(v==='k'?'知ってる':v==='u'?'知らない':'未仕分け')+'にしました')};
 $('bk2').onclick=()=>ap('k');$('bu2').onclick=()=>ap('u');$('bn2').onclick=()=>ap('');
}
/* ---------- 知らない一覧 ---------- */
function renderUnk(P){
 const M=$('main');
 M.innerHTML='<div class="ctl"><input class="full" type="search" id="uq" placeholder="知らない語を検索（語・読み・意味・用例）" value="'+esc(uq)+'"></div><div id="ures"></div>';
 $('uq').oninput=e=>{uq=e.target.value;up=0;unkBody()};
 unkBody();
}
function unkBody(){
 const q=uq.trim();const U=pool().filter(x=>st[x.w]==='u'&&(!q||x.w.includes(q)||x.r.includes(q)||x.m.includes(q)||x.ex.some(e=>e.includes(q))));
 const n=U.length,pages=Math.max(1,Math.ceil(n/PER));if(up>=pages)up=pages-1;
 const R=$('ures');
 if(!n){R.innerHTML='<div class="empty">'+(q?'該当する知らない語はありません。':'知らない語はまだありません。「仕分け」や「一覧」で知らないに分けた語がここに出ます。')+'</div>';return}
 R.innerHTML=pager(n,up,'u')+'<div class="row" style="justify-content:flex-end;margin:0 0 6px"><button class="sbtn" id="oa">すべて開く</button><button class="sbtn" id="ca">すべて閉じる</button></div>'+U.slice(up*PER,up*PER+PER).map(x=>'<details class="uk" data-w="'+esc(x.w)+'"><summary><b style="font-size:17px">'+esc(x.w)+'</b><span class="sub">'+esc(x.r)+'</span><span class="m">'+esc(x.m)+'</span></summary><div class="body"><div class="sub">読み方：'+esc(x.r)+'</div><div><b>意味</b>：'+esc(x.m)+'</div>'+x.ex.map((e,i)=>'<div>用例'+(i+1)+'：'+esc(e)+'</div>').join('')+'<div class="sub">出典：<a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+V[x.vol]+'">'+pad(x.vol)+'</a></div><div class="row" style="justify-content:flex-start"><button class="sbtn mk">覚えた → 知ってるへ</button></div></div></details>').join('')+(n>PER?pager(n,up,'u'):'');
 R.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{up+=+b.dataset.d;unkBody();window.scrollTo(0,R.offsetTop-60)});
 $('oa').onclick=()=>R.querySelectorAll('details').forEach(d=>d.open=true);
 $('ca').onclick=()=>R.querySelectorAll('details').forEach(d=>d.open=false);
 R.querySelectorAll('.mk').forEach(b=>b.onclick=()=>{const d=b.closest('details'),w=d.dataset.w;setSt(w,'k');save();stats(pool());d.style.transition='opacity .2s';d.style.opacity='0';toast('「'+w+'」を知ってるへ移動');setTimeout(unkBody,200)});
}
render();
</script></body></html>
